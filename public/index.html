    ${yt.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+3.5}" text-anchor="end">${short(t)}</text>`).join('')}
    ${xt.map((t,i)=>`<text x="${x(t)}" y="${H-8}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${dec(t,S.scatterX==='hour'?0:1)}</text>`).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${y(FLOP)}" y2="${y(FLOP)}" stroke="var(--bad)" stroke-dasharray="3 4" opacity=".7"/>
    ${list.map(v=>`<circle class="pt" cx="${x(nf.g(v)).toFixed(1)}" cy="${y(Math.max(1,v.views)).toFixed(1)}" r="4" fill="${col[status(v)]}" fill-opacity=".7" data-vid="${v.id}" data-ptip="${esc(v.title)}|${fmt(v.views)} Views · ${esc(nf.l)}: ${dec(nf.g(v))}" style="cursor:pointer"></circle>`).join('')}
  </svg>
  <p style="margin-top:8px;font-size:13px"><b>${strength} Zusammenhang</b>${Math.abs(rho)>=.12?`: ${nf.phrase.toLowerCase()}, desto ${rho>0?'mehr':'weniger'} Views.`:' mit deinen Views.'} <span class="mono" style="color:var(--faint)">ρ = ${dec(rho,2)}</span></p>
  <div class="legend"><span><i style="background:var(--bad)"></i>Flop</span><span><i style="background:var(--accent)"></i>Gut</span><span><i style="background:var(--good)"></i>Viral</span></div>`;
}

function bestOf(vs,key){const m=new Map();for(const v of vs){if(!m.has(v[key]))m.set(v[key],[]);m.get(v[key]).push(v.views)}let b=null;for(const [k,a] of m)if(a.length>=2&&(!b||median(a)>b.m))b={k,m:median(a),n:a.length};return b}
const PALETTE=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const resultParts=vs=>{const fl=vs.filter(v=>v.views<FLOP).length,vi=vs.filter(v=>v.views>=VIRAL).length;
  return [{l:'Flop',n:fl,c:'var(--bad)'},{l:'Gut',n:vs.length-fl-vi,c:'var(--faint)',o:.5},{l:'Viral',n:vi,c:'var(--good)'}]};
function strStats(){
  const overall=median(AV().map(v=>v.views));
  return [...groups(catByKey('streamer'),AV())].map(([name,vs])=>{
    const n=vs.length,med=median(vs.map(v=>v.views)),fol=vs.reduce((s,v)=>s+v.follower,0);
    return {name,vs,n,med,fol,fpv:fol/n,flop:vs.filter(v=>v.views<FLOP).length/n*100,viral:vs.filter(v=>v.views>=VIRAL).length,eng:median(vs.map(eng)),above:med>=overall,
      hook:bestOf(vs,'hook'),emotion:bestOf(vs,'emotion'),spiel:bestOf(vs,'spiel')};

const STR_SORTS={median:{l:'Median-Views',v:s=>s.med},fpv:{l:'Follower pro Video',v:s=>s.fpv},fol:{l:'Follower gesamt',v:s=>s.fol},
  flop:{l:'Flop-Quote',v:s=>s.flop,asc:true},n:{l:'Anzahl Videos',v:s=>s.n},eng:{l:'Engagement',v:s=>s.eng},name:{l:'Name',v:s=>s.name.toLowerCase(),asc:true}};
const STR_MIN=[[1,'Alle Streamer'],[2,'ab 2 Videos'],[3,'ab 3 Videos'],[5,'ab 5 Videos'],[10,'ab 10 Videos']];
function sortedStats(){
  const srt=STR_SORTS[S.strSort]||STR_SORTS.median;
  return strStats().filter(s=>s.n>=S.strMin).sort((a,b)=>{const x=srt.v(a),y=srt.v(b);return (x>y?1:x<y?-1:0)*S.strDir||b.n-a.n});
}
/* Mögliche Doppelungen, z. B. „letshugo“ und „Letshugo“ */
function strDupes(stats){
  const out=[],norm=s=>s.toLowerCase().replace(/[\s_.-]+/g,'');
  for(let i=0;i<stats.length;i++)for(let j=i+1;j<stats.length;j++){
    const a=stats[i],b=stats[j],la=norm(a.name),lb=norm(b.name);
    if(la===lb||(Math.min(la.length,lb.length)>=5&&lev(la,lb)<=1))out.push(a.n>=b.n?{from:b.name,to:a.name,n:b.n}:{from:a.name,to:b.name,n:a.n});
  }
  return out;
}
/* Matrix: Anzahl Videos × Median-Views */
function strMatrix(stats){
  if(stats.length<2)return '<p class="empty-msg">Ab 2 Streamern siehst du hier, wen du mehr clippen solltest.</p>';
  const W=560,H=300,pl=50,pr=20,pt=16,pb=34;
  const overall=median(AV().map(v=>v.views)),avgN=stats.reduce((s,x)=>s+x.n,0)/stats.length;
  const xmax=Math.max(2,...stats.map(s=>s.n))*1.1;
  const meds=stats.map(s=>Math.max(1,s.med));

function strFazit(name,vs){
  const overall=median(AV().map(v=>v.views)),med=median(vs.map(v=>v.views));
  if(vs.length<3)return `Mit ${vs.length} Video${vs.length===1?'':'s'} gibt es bei ${esc(name)} noch kein klares Bild. Ab etwa 5 Videos wird es aussagekräftig.`;
  const r=overall?med/overall:1;
  const how=r>=1.05?`läuft <b>${dec(r)}× so gut</b> wie dein Schnitt`:r<=.95?`läuft <b>${Math.round((1-r)*100)} % schlechter</b> als dein Schnitt`:'liegt <b>genau in deinem Schnitt</b>';
  const e=bestOf(vs,'emotion'),h=bestOf(vs,'hook'),bad=strWorst(vs)[0];
  let txt=`${esc(name)} ${how}`;
  if(e||h)txt+=`, am besten ${e?`mit <b>${esc(e.k)}</b>-Clips`:''}${e&&h?' und ':''}${h?`dem Hook <b>„${esc(h.k)}“</b>`:''}`;
  txt+='.';
  if(bad)txt+=` Eher schwach: ${bad.label} „${esc(bad.val)}“.`;
  const fpv=vs.reduce((s,v)=>s+v.follower,0)/vs.length,allF=AV().reduce((s,v)=>s+v.follower,0)/Math.max(1,AV().length);
  txt+=` Pro Video bringt er dir ${dec(fpv)} neue Follower (dein Schnitt: ${dec(allF)}).`;
  return txt;
}
const STR_CATS=[['hook','Hook'],['emotion','Emotion'],['spiel','Spiel'],['thema','Thema'],['overlay','Text-Overlay']];

  else if(id==='gField'){S.groupField=v;smoothH(barsCard,renderBars)}
  else if(id==='gMetric'){S.groupMetric=v;smoothH(barsCard,renderBars)}
  else if(id==='hA'){S.heatA=v;renderHeat()}
  else if(id==='hB'){S.heatB=v;renderHeat()}
  else if(id==='hM'){S.heatMetric=v;renderHeat()}
  else if(id==='sX'){S.scatterX=v;renderScatter()}
  else if(id==='useW'){S.useWeights=t.checked;renderAll()}
  else if(t.name&&t.name.startsWith('dw_')){
    const vv=VIDEOS.find(x=>x.id===openId);if(!vv)return;
    const k=t.name.slice(3);
    vv.weights=vv.weights||{};if(+v!==1)vv.weights[k]=+v;else delete vv.weights[k];
    renderAll();$('#whyBox').innerHTML=whyHtml(vv);updateVideo(vv).then(()=>toast(DEMO?'Nur in der Vorschau geändert':'Einschätzung gespeichert')).catch(fail);
  }
  else if(id==='dampen'){S.dampen=t.checked;remember('clipradar-dampen',t.checked?'1':'0');renderAll()}
});
document.addEventListener('focusout',e=>{const t=e.target;if(t.closest&&t.closest('#vform')&&COMBO_KEYS[t.id])checkTypo(t)});

fillInfoSlots();
$('#flopInput').value=FLOP;$('#viralInput').value=VIRAL;$('#outHiInput').value=OUT_HI;
show(location.hash.slice(1)||S.tab);
$('#view-'+S.tab).innerHTML=SKELETONS[S.tab]||SKELETON;
Promise.all([loadVideos(),loadSettings()]).then(renderAll).catch(e=>{$('#view-'+S.tab).innerHTML=`<div class="card empty-state"><h2>Daten konnten nicht geladen werden</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`});
</script>
</body>
</html>
