<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clipradar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#141722; --muted:#5D6375; --line:#DCE0E9;
  --accent:#3346E0; --accent-ink:#FFFFFF; --accent-soft:rgba(51,70,224,.11);
  --good:#0F8456; --good-soft:rgba(15,132,86,.12); --bad:#D33A44; --bad-soft:rgba(211,58,68,.11); --warn:#A86A12; --warn-soft:rgba(168,106,18,.13);
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1016; --surface:#171A23; --surface-2:#1E2230; --ink:#E8EAF1; --muted:#949AAC; --line:#2A2F3D;
    --accent:#8190FF; --accent-ink:#0E1016; --accent-soft:rgba(129,144,255,.16);
    --good:#3FCB8E; --good-soft:rgba(63,203,142,.14); --bad:#FF6B74; --bad-soft:rgba(255,107,116,.14); --warn:#E6AE45; --warn-soft:rgba(230,174,69,.15);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1016; --surface:#171A23; --surface-2:#1E2230; --ink:#E8EAF1; --muted:#949AAC; --line:#2A2F3D;
  --accent:#8190FF; --accent-ink:#0E1016; --accent-soft:rgba(129,144,255,.16);
  --good:#3FCB8E; --good-soft:rgba(63,203,142,.14); --bad:#FF6B74; --bad-soft:rgba(255,107,116,.14); --warn:#E6AE45; --warn-soft:rgba(230,174,69,.15);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.brand small{font-family:var(--mono);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.side-foot label{font-weight:500;color:var(--ink)}
.side-foot input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-family:var(--mono)}
.side-actions a.btn{text-decoration:none;color:var(--ink)}
.loading{color:var(--muted);padding:40px 0}
.demo-banner{max-width:1180px;margin-bottom:20px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.demo-banner p{color:var(--ink)}

main{padding:28px 32px 60px;min-width:0}
.view{display:flex;flex-direction:column;gap:20px;max-width:1180px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.view-head p{color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-head p{color:var(--muted);font-size:13px;margin-top:2px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kpi .val{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:3px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.flop{background:var(--bad-soft);color:var(--bad)}
.pill.gut{background:var(--accent-soft);color:var(--accent)}
.pill.viral{background:var(--good-soft);color:var(--good)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.link{border:none;background:none;color:var(--accent);padding:4px 0}
select.ctl,input.ctl{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl-row label{font-size:12px;color:var(--muted)}

/* insights */
.ins-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ins{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.ins:first-child{border-top:none}
.ins:hover{background:var(--surface-2)}
.ins .dir{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ins .dir.up{background:var(--good-soft);color:var(--good)}
.ins .dir.down{background:var(--bad-soft);color:var(--bad)}
.ins p{font-size:14px}
.ins small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-family:var(--mono)}
.conf{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:5px;white-space:nowrap}
.conf.stark{background:var(--accent);color:var(--accent-ink)}
.conf.mittel{background:var(--accent-soft);color:var(--accent)}
.conf.schwach{border:1px dashed var(--line);color:var(--muted)}
.caveat{font-size:12px;color:var(--muted);margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 62px;gap:12px;align-items:center}
.bar-row .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .name small{display:block;font-weight:400;color:var(--muted);font-size:11px;font-family:var(--mono)}
.track{position:relative;height:22px;background:var(--surface-2);border-radius:5px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.track .fill.low{background:var(--muted);opacity:.45}
.track .avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.bar-row .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* heatmap */
.scroll-x{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
table.heat th{font-weight:500;color:var(--muted);padding:4px 6px;text-align:left;white-space:nowrap}
table.heat thead th{text-align:center;max-width:110px;white-space:normal;line-height:1.2;vertical-align:bottom}
table.heat td{min-width:78px;height:46px;border-radius:6px;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}
table.heat td small{display:block;font-weight:400;font-size:10px;opacity:.75}
table.heat td.empty{background:var(--surface-2);color:var(--muted);font-weight:400}

/* video table */
table.vt{width:100%;border-collapse:collapse;font-size:13px}
table.vt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.vt th.n,table.vt td.n{text-align:right}
table.vt th .arr{opacity:.8}
table.vt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vt tbody tr{cursor:pointer}
table.vt tbody tr:hover{background:var(--surface-2)}
.vt .t{font-weight:500;max-width:360px}
.vt .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.recent{display:flex;flex-direction:column}
.recent-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.recent-row:first-child{border-top:none}
.recent-row:hover{background:var(--surface-2)}
.recent-row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-row .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.dist{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 10px}
.dist span{display:block;height:100%}

/* streamer */
.g-str{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.str{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.str:hover{border-color:var(--accent)}
.str-top{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.str-top small{display:block;color:var(--muted);font-size:12px}
.str-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.str-stats div{display:flex;flex-direction:column}
.str-stats b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.str-stats span{font-size:11px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:2px;height:38px}
.spark i{flex:1;border-radius:2px 2px 0 0;min-height:3px}
.str dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13px}
.str dt{color:var(--muted)}
.str dd{margin:0;font-weight:500}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.drawer-head p{color:var(--muted);font-size:13px;margin-top:4px}
.drawer-body{overflow-y:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:20px}
.x{border:none;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mgrid div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column}
.mgrid span{font-size:11px;color:var(--muted)}
.mgrid b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .chip b{font-weight:500;color:var(--muted);margin-right:4px}
.why{border-radius:10px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-size:17px;font-weight:700}
.fac{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fac li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px}
.fac li::before{font-weight:700}
.fac.pos li::before{content:"+";color:var(--good)}
.fac.neg li::before{content:"–";color:var(--bad)}
.fac small{color:var(--muted);font-family:var(--mono);font-size:11px}
.why h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--body);font-weight:600}

/* form */
form{display:flex;flex-direction:column;gap:22px}
fieldset{border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
legend{font-family:var(--display);font-weight:700;font-size:15px;padding:0;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > label,.f > .flabel{font-size:12px;font-weight:500;color:var(--muted)}
.f input[type=text],.f input[type=number],.f input[type=datetime-local],.f input[type=url]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:100%}
.f input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f.full{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:5px 11px;border-radius:7px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.opts input:checked + span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opts input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-40px;background:var(--surface);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:500}

svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}

.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.side-actions{display:flex;flex-direction:column;gap:6px}
.side-actions .btn{justify-content:center;font-size:13px;padding:7px 10px}
.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:30px 24px}
.empty-state p{color:var(--muted);max-width:52ch}
.empty-msg{color:var(--muted);padding:12px 4px}

/* Gewichtung */
.wrows{display:flex;flex-direction:column}
.wrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:7px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:none}
.wl{font-size:13px;font-weight:500}
.wl small{font-weight:400;color:var(--muted);margin-left:4px}
.wseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.wseg label{cursor:pointer}
.wseg input{position:absolute;opacity:0;pointer-events:none}
.wseg span{display:block;padding:4px 10px;font-size:12px;background:var(--surface);border-left:1px solid var(--line)}
.wseg label:first-child span{border-left:none}
.wseg input:checked + span{background:var(--surface-2);font-weight:600}
.wseg input[value="2"]:checked + span{background:var(--accent-soft);color:var(--accent)}
.wseg input[value="3"]:checked + span{background:var(--accent);color:var(--accent-ink)}
.wseg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-2px}
.hint{font-size:12px;color:var(--muted)}
.belief{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.belief li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px}
.belief .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.belief .ic.ok{background:var(--good-soft);color:var(--good)}
.belief .ic.no{background:var(--warn-soft);color:var(--warn)}
.belief .ic.na{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.belief small{display:block;color:var(--muted);font-size:12px}
.wbadge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:4px;white-space:nowrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

@media (max-width:980px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:10;flex-direction:column;gap:10px;padding:12px 16px;border-right:none;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;overflow-x:auto}
  nav a{padding:7px 10px;white-space:nowrap}
  nav a svg{display:none}
  .side-foot{display:none}
  main{padding:20px 16px 60px}
  h1{font-size:23px}
  .bar-row{grid-template-columns:minmax(80px,110px) minmax(0,1fr) 54px;gap:8px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span>Clipradar</div>
    <nav id="nav">
      <a href="#uebersicht" data-tab="uebersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Übersicht</a>

  <div class="drawer-body" id="drawerBody"></div>

<script>
/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const dec=(n,d=1)=>n.toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const short=n=>n>=1e6?dec(n/1e6)+' Mio.':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?dec(n/1e3)+'k':String(Math.round(n));
const pct=n=>Math.round(n)+' %';
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
const dateStr=d=>`${d.getDate()}. ${MONTHS[d.getMonth()]}`;
const timeStr=d=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
let FLOP=9000; const VIRAL=100000;
const status=v=>v.views<FLOP?'flop':v.views>=VIRAL?'viral':'gut';
const STATUS_LABEL={flop:'Flop',gut:'Gut',viral:'Viral'};
const pill=v=>`<span class="pill ${status(v)}">${STATUS_LABEL[status(v)]}</span>`;

/* ---------- Beispieldaten (mit eingebauten Mustern) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=mulberry32(20261011);
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const pick=arr=>{const tot=arr.reduce((s,o)=>s+(o.w||1),0);let r=rnd()*tot;for(const o of arr){r-=(o.w||1);if(r<=0)return o}return arr[arr.length-1]};

const STREAMERS=[{n:'Papaplatte',e:.55,w:5},{n:'Trymacs',e:.25,w:5},{n:'Letshugo',e:.05,w:4},{n:'Eliasn97',e:-.15,w:4},{n:'Reved',e:.15,w:2},{n:'NoWay',e:-.3,w:2}];
const GAMES=[{n:'Fortnite',e:.1,w:3},{n:'Minecraft',e:0,w:3},{n:'GTA RP',e:.2,w:2},{n:'EA FC',e:-.25,w:3},{n:'Just Chatting',e:.05,w:3},{n:'Valorant',e:-.1,w:2}];
const THEMEN=[{n:'Clutch/Skill',e:0},{n:'Fail',e:.25},{n:'Reaction',e:-.1},{n:'Story',e:-.3},{n:'Challenge',e:.15},{n:'Streit/Drama',e:.35}];
const HOOKS=[{n:'Schockmoment zuerst',e:.45,w:3},{n:'Frage',e:.15,w:2},{n:'Zitat',e:.05,w:2},{n:'Cliffhanger',e:.2,w:2},{n:'Direkt rein',e:-.3,w:3}];
const EMOS=[{n:'lustig',e:.3,w:3},{n:'Rage',e:.35,w:2},{n:'Schock',e:.1,w:2},{n:'wholesome',e:-.25,w:2},{n:'Drama',e:.15,w:1},{n:'Skill',e:-.1,w:2}];
const OVERLAYS=[{n:'keins',e:-.25,w:2},{n:'Frage',e:.25,w:2},{n:'Aussage',e:.05,w:2},{n:'Spoiler',e:-.15,w:1}];
const UT=[{n:'ja',e:.4,w:3},{n:'nein',e:-.1,w:2}];
const AUDIO=[{n:'nur Original',e:0,w:3},{n:'mit Musik',e:-.1,w:2},{n:'Trend-Sound',e:.25,w:2}];
const MUSIK=['Lo-Fi Beat','Sad Violin','Epic Orchestra'], TREND=['Phonk Drift','Bass Drop 2026','Sped-up Hymne'];
const HOURS=[{h:9,w:1},{h:11,w:1},{h:13,w:2},{h:15,w:2},{h:17,w:3},{h:18,w:3},{h:19,w:3},{h:20,w:3},{h:21,w:2},{h:22,w:2},{h:23,w:1}];
const TITLE={lustig:'Lachflash',Rage:'Rage-Ausraster',Schock:'Schockmoment',wholesome:'Wholesome-Moment',Drama:'Streit eskaliert',Skill:'Krasser Clutch'};

const SAMPLE_WKEYS=['hook','emotion','streamer','overlay','untertitel','pointe','upload','thema'];
function makeSample(){
  rnd=mulberry32(20261011);
  const out=[];
  const start=new Date(2026,8,6);
  for(let i=0;i<72;i++){
    const s1=pick(STREAMERS),streamers=[s1.n];let eff=s1.e;
    if(rnd()<.16){const s2=pick(STREAMERS.filter(s=>s.n!==s1.n));streamers.push(s2.n);eff+=s2.e*.5+.1}
    const game=pick(GAMES),thema=pick(THEMEN),hook=pick(HOOKS),emo=pick(EMOS),ov=pick(OVERLAYS),ut=pick(UT),au=pick(AUDIO);
    const sound=au.n==='nur Original'?'Originalton':(au.n==='mit Musik'?MUSIK:TREND)[Math.floor(rnd()*3)];
    const date=new Date(start.getTime()+Math.floor(i*35/72)*864e5);
    const hour=pick(HOURS).h;date.setHours(hour,Math.floor(rnd()*4)*15);
    const pointe=1+Math.floor(rnd()*11),laenge=12+Math.floor(rnd()*58);
    const content=eff+game.e+thema.e+hook.e+emo.e+ov.e+ut.e+au.e-(pointe-3)*.07+(laenge>45?-.2:0);
    const timeEff=hour<12?-.35:hour<17?-.05:hour<21?.25:.05;
    const views=Math.max(350,Math.round(Math.exp(Math.log(7000)+content+timeEff+gauss()*.7)));
    const ret3=Math.max(18,Math.min(88,Math.round(50+9*(hook.e+ov.e+ut.e)+gauss()*5-pointe*.7+content*3)));
    const completion=Math.max(5,Math.min(85,Math.round(68-laenge*.6+8*content+gauss()*6)));
    const c=completion/100;
    const avgWatch=Math.min(laenge,Math.round(laenge*(c+.3*(1-c))*10)/10);
    const follower=Math.max(0,Math.round(views*.0045*Math.exp(gauss()*.4+(emo.n==='lustig'?.2:0))));
    const moodScore=content+gauss()*.45-(emo.n==='Drama'?.5:0);
    const weights={};
    if(rnd()<.35){const k=SAMPLE_WKEYS[Math.floor(rnd()*SAMPLE_WKEYS.length)];weights[k]=rnd()<.5?3:2}
    out.push({weights,
      id:i+1,title:`${streamers.join(' & ')}: ${TITLE[emo.n]} in ${game.n}`,date,streamers,
      spiel:game.n,thema:thema.n,hook:hook.n,emotion:emo.n,overlay:ov.n,untertitel:ut.n,audio:au.n,sound,
      pointe,laenge,views,follower,ret3,completion,avgWatch,
      likes:Math.round(views*(.06+rnd()*.05)),comments:Math.round(views*(.003+rnd()*.004)),
      shares:Math.round(views*(.003+rnd()*.01)),saves:Math.round(views*(.002+rnd()*.006)),
      totalWatch:Math.round(views*avgWatch/3600),
      stimmung:moodScore>.45?'positiv':moodScore<-.2?'negativ':'gemischt'
    });
  }
  return out;
}

/* ---------- Daten (Cloudflare D1 über /api) ---------- */
const VIDEOS=[];
let DEMO=false; // Beispieldaten nur im Browser, nie in der Datenbank
async function api(method,path,body){
  const r=await fetch('/api'+path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  if(r.status===401){location.href='/login';throw new Error('Nicht angemeldet')}
  if(!r.ok)throw new Error((await r.text())||('Fehler '+r.status));
  return r.status===204?null:r.json();
}
const toData=v=>{const {id,...rest}=v;return {...rest,date:v.date.toISOString()}};
const NUM_FIELDS=['views','follower','likes','comments','shares','saves','avgWatch','totalWatch','completion','ret3','laenge','pointe'];
const TEXT_DEFAULTS={title:'Ohne Titel',spiel:'Unbekannt',thema:'Unbekannt',hook:'Unbekannt',sound:'Originalton',emotion:'unbekannt',overlay:'keins',untertitel:'nein',audio:'nur Original',stimmung:'gemischt'};
const fromRow=r=>{
  const v={...TEXT_DEFAULTS,...r.data,id:r.id,date:new Date(r.data.date),weights:r.data.weights||{},streamers:r.data.streamers||[]};
  for(const k of NUM_FIELDS)v[k]=Number.isFinite(+v[k])?+v[k]:0;
  return v;
};
async function loadVideos(){const rows=await api('GET','/videos');VIDEOS.length=0;VIDEOS.push(...rows.map(fromRow))}
async function createVideo(v){const r=await api('POST','/videos',toData(v));v.id=r.id;VIDEOS.push(v);return v}
async function updateVideo(v){if(!DEMO)await api('PUT','/videos/'+v.id,toData(v))}
async function deleteVideo(id){if(!DEMO)await api('DELETE','/videos/'+id);const i=VIDEOS.findIndex(v=>v.id===id);if(i>=0)VIDEOS.splice(i,1)}
async function deleteAll(){if(DEMO)return exitDemo();await api('DELETE','/videos');VIDEOS.length=0}
function startDemo(){DEMO=true;VIDEOS.length=0;VIDEOS.push(...makeSample());renderAll();toast('Beispieldaten geladen')}
async function exitDemo(){DEMO=false;VIDEOS.length=0;renderAll();await loadVideos();renderAll()}
function fail(e){console.error(e);toast('Speichern fehlgeschlagen: '+e.message)}

/* ---------- Gewichtung ---------- */
const WEIGHTS=[{v:1,l:'normal'},{v:2,l:'wichtig'},{v:3,l:'Hauptgrund'}];
const WLABEL={2:'wichtig',3:'Hauptgrund'};
const WKEYS=[{k:'streamer',l:'Streamer'},{k:'spiel',l:'Spiel'},{k:'thema',l:'Thema'},{k:'hook',l:'Hook'},{k:'emotion',l:'Emotion'},{k:'overlay',l:'Text-Overlay'},
  {k:'untertitel',l:'Untertitel'},{k:'audio',l:'Audio'},{k:'sound',l:'Sound'},{k:'upload',l:'Uploadzeitpunkt'},{k:'laenge',l:'Videolänge'},{k:'pointe',l:'Zeit bis zur Pointe'}];
function tagValue(v,k){
  if(k==='streamer')return v.streamers.join(', ');
  if(k==='upload')return `${DAYS[v.date.getDay()]} ${timeStr(v.date)} Uhr`;
  if(k==='laenge'||k==='pointe')return v[k]+' s';
  return v[k];
}
function weightRows(prefix,weights,v){
  return `<div class="wrows">${WKEYS.map(w=>`<div class="wrow"><span class="wl">${w.l}${v?`<small>${esc(tagValue(v,w.k))}</small>`:''}</span>
    <div class="wseg" role="radiogroup" aria-label="Gewichtung ${w.l}">${WEIGHTS.map(o=>`<label><input type="radio" name="${prefix}${w.k}" value="${o.v}" ${(weights[w.k]||1)===o.v?'checked':''}><span>${o.l}</span></label>`).join('')}</div></div>`).join('')}</div>`;
}

/* ---------- Analyse-Logik ---------- */
const hourBucket=h=>h<12?'Morgens (bis 12 Uhr)':h<17?'Mittags (12–17 Uhr)':h<21?'Abends (17–21 Uhr)':'Spät (ab 21 Uhr)';
const CAT=[
  {k:'streamer',l:'Streamer',wk:'streamer',g:v=>v.streamers},
  {k:'spiel',l:'Spiel',wk:'spiel',g:v=>[v.spiel]},
  {k:'thema',l:'Thema',wk:'thema',g:v=>[v.thema]},
  {k:'hook',l:'Hook',wk:'hook',g:v=>[v.hook]},
  {k:'emotion',l:'Emotion',wk:'emotion',g:v=>[v.emotion]},
  {k:'overlay',l:'Text-Overlay',wk:'overlay',g:v=>[v.overlay]},
  {k:'untertitel',l:'Untertitel',wk:'untertitel',g:v=>[v.untertitel]},
  {k:'audio',l:'Audio',wk:'audio',g:v=>[v.audio]},
  {k:'sound',l:'Sound',wk:'sound',g:v=>[v.sound]},
  {k:'tageszeit',l:'Uploadzeit',wk:'upload',g:v=>[hourBucket(v.date.getHours())]},
  {k:'wochentag',l:'Wochentag',wk:'upload',g:v=>[DAYS[v.date.getDay()]]},
  {k:'laengeB',l:'Videolänge',wk:'laenge',g:v=>[v.laenge<20?'unter 20 s':v.laenge<=40?'20–40 s':'über 40 s']},
  {k:'pointeB',l:'Zeit bis zur Pointe',wk:'pointe',g:v=>[v.pointe<=3?'0–3 s':v.pointe<=6?'4–6 s':'7 s und mehr']},
  {k:'stimmung',l:'Kommentarstimmung',g:v=>[v.stimmung],after:true}
];
const catByKey=k=>CAT.find(f=>f.k===k);
const NUM=[
  {k:'ret3',l:'Zuschauer nach 3 s',g:v=>v.ret3,phrase:'Je mehr Zuschauer nach 3 Sekunden noch da sind'},
  {k:'completion',l:'Komplett angesehen',g:v=>v.completion,phrase:'Je öfter das Video komplett angesehen wird'},
  {k:'pointe',l:'Zeit bis zur Pointe (s)',g:v=>v.pointe,phrase:'Je später die Pointe kommt'},
  {k:'laenge',l:'Videolänge (s)',g:v=>v.laenge,phrase:'Je länger das Video ist'},
  {k:'hour',l:'Upload-Uhrzeit',g:v=>v.date.getHours()+v.date.getMinutes()/60,phrase:'Je später am Tag du hochlädst'},
  {k:'avgWatch',l:'Ø Wiedergabedauer (s)',g:v=>v.avgWatch,phrase:'Je länger die durchschnittliche Wiedergabedauer'}
];
/* Gewichteter Median: ein Video mit Gewicht 3 zählt wie drei Videos */
function wmedian(vals,ws){
  if(!vals.length)return 0;
  const p=vals.map((v,i)=>[v,ws[i]]).sort((a,b)=>a[0]-b[0]),tot=p.reduce((s,x)=>s+x[1],0);let c=0;
  for(let i=0;i<p.length;i++){c+=p[i][1];if(c>tot/2)return p[i][0];if(c===tot/2&&p[i+1])return(p[i][0]+p[i+1][0])/2}
  return p[p.length-1][0];
}
const ONE=()=>1;
const W=(v,f)=>S.useWeights&&f&&f.wk?(v.weights&&v.weights[f.wk])||1:1;
const wm=(vs,get,wf)=>wmedian(vs.map(get),vs.map(wf));
const METRICS={
  views:{l:'Median-Views (24 h)',f:(vs,wf=ONE)=>wm(vs,v=>v.views,wf),fmt:short},
  follower:{l:'Median neue Follower',f:(vs,wf=ONE)=>wm(vs,v=>v.follower,wf),fmt:fmt},
  flop:{l:'Flop-Quote',f:(vs,wf=ONE)=>{const t=vs.reduce((s,v)=>s+wf(v),0);return t?vs.reduce((s,v)=>s+(v.views<FLOP?wf(v):0),0)/t*100:0},fmt:pct,lowerBetter:true},
  ret3:{l:'Zuschauer nach 3 s',f:(vs,wf=ONE)=>wm(vs,v=>v.ret3,wf),fmt:pct},
  completion:{l:'Komplett angesehen',f:(vs,wf=ONE)=>wm(vs,v=>v.completion,wf),fmt:pct},
  engagement:{l:'Engagement-Rate',f:(vs,wf=ONE)=>wm(vs,v=>v.views?(v.likes+v.comments+v.shares+v.saves)/v.views*100:0,wf),fmt:n=>dec(n)+' %'}
};
const marks=(vs,f)=>vs.filter(v=>f.wk&&v.weights&&v.weights[f.wk]>1).length;
function groups(f,list=VIDEOS){const m=new Map();for(const v of list)for(const val of f.g(v)){if(!m.has(val))m.set(val,[]);m.get(val).push(v)}return m}
function ranks(a){const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);const r=new Array(a.length);for(let i=0;i<idx.length;){let j=i;while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;for(let k=i;k<=j;k++)r[idx[k][1]]=(i+j)/2+1;i=j+1}return r}
function pearson(x,y){const n=x.length;if(n<3)return 0;const mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)**2;sy+=(y[i]-my)**2}return sx&&sy?sxy/Math.sqrt(sx*sy):0}
const spearman=(x,y)=>pearson(ranks(x),ranks(y));
const confOf=s=>s>=2.5?'stark':s>=1.3?'mittel':'schwach';
const MIN_N=4;

function computeInsights(mk){
  const val=v=>mk==='follower'?v.follower:v.views;
  const unit=mk==='follower'?'neue Follower':'Views';
  const out=[];
  for(const f of CAT){
    if(f.after)continue;
    const wf=v=>W(v,f);
    let best=null;
    for(const [name,vs] of groups(f)){
      const rest=VIDEOS.filter(v=>!f.g(v).includes(name));
      if(vs.length<MIN_N||rest.length<MIN_N)continue;
      const a=wm(vs,val,wf),b=wm(rest,val,wf);
      if(!a||!b)continue;
      const ratio=a/b,score=Math.abs(Math.log(ratio))*Math.sqrt(Math.min(vs.length,rest.length));
      if(!best||score>best.score)best={name,a,b,ratio,n:vs.length,rn:rest.length,score,mk:marks(vs,f)};
    }
    if(!best||Math.abs(Math.log(best.ratio))<Math.log(1.25))continue;
    const up=best.ratio>=1;
    const eff=up?`<b class="num">${dec(best.ratio)}×</b> so viele ${unit}`:`<b class="num">${Math.round((1-best.ratio)*100)} %</b> weniger ${unit}`;
    out.push({field:f.k,up,score:best.score,conf:confOf(best.score),
      html:`${esc(f.l)} <b>„${esc(best.name)}“</b> bringt ${eff} als der Rest${best.mk&&S.useWeights?`<span class="wbadge">${best.mk}× von dir markiert</span>`:''}`,
      detail:`Median ${fmt(best.a)} vs. ${fmt(best.b)} · ${best.n} vs. ${best.rn} Videos`});
  }
  for(const nf of NUM){
    const rho=spearman(VIDEOS.map(nf.g),VIDEOS.map(val));
    if(Math.abs(rho)<.2)continue;
    const score=Math.abs(rho)*Math.sqrt(VIDEOS.length)*.8;
    out.push({num:nf.k,up:rho>0,score,conf:confOf(score),
      html:`${nf.phrase}, desto <b>${rho>0?'mehr':'weniger'}</b> ${unit}`,
      detail:`Rangkorrelation ρ = ${dec(rho,2)} · ${VIDEOS.length} Videos`});
  }
  return out.sort((a,b)=>b.score-a.score);
}
function insightList(items){
  return `<ul class="ins-list">${items.map(it=>`<li class="ins" tabindex="0" ${it.field?`data-field="${it.field}"`:`data-num="${it.num}"`}>
    <span class="dir ${it.up?'up':'down'}">${it.up?'▲':'▼'}</span>
    <div><p>${it.html}</p><small>${it.detail}</small></div>
    <span class="conf ${it.conf}">${it.conf}</span></li>`).join('')}</ul>`;
}

function explain(v){
  const allMed=median(VIDEOS.map(x=>x.views));
  const facs=[];
  for(const f of CAT){
    if(f.after)continue;
    const wf=x=>W(x,f);
    for(const val of f.g(v)){
      const vs=VIDEOS.filter(x=>f.g(x).includes(val)),rest=VIDEOS.filter(x=>!f.g(x).includes(val));
      const ok=vs.length>=MIN_N&&rest.length>=MIN_N;
      const r=ok?wm(vs,x=>x.views,wf)/(wm(rest,x=>x.views,wf)||1):null;
      facs.push({f,txt:`${f.l} „${val}“`,r,n:vs.length,ok});
    }
  }
  const tag=x=>{const w=v.weights&&v.weights[x.f.wk];return w>1?` <span class="wbadge">${WLABEL[w]}</span>`:''};
  const good=facs.filter(x=>x.ok);
  const pos=good.filter(x=>x.r>1.2).sort((a,b)=>b.r-a.r).slice(0,4).map(x=>({t:esc(x.txt)+tag(x),d:`läuft bei dir ${dec(x.r)}× so gut wie der Rest · ${x.n} Videos`}));
  const neg=good.filter(x=>x.r<.83).sort((a,b)=>a.r-b.r).slice(0,4).map(x=>({t:esc(x.txt)+tag(x),d:`läuft bei dir ${Math.round((1-x.r)*100)} % schlechter · ${x.n} Videos`}));
  const r3=median(VIDEOS.map(x=>x.ret3));
  if(VIDEOS.length>=MIN_N&&v.ret3>=r3+6)pos.unshift({t:`Starker Einstieg: ${v.ret3} % nach 3 s`,d:`dein Median liegt bei ${Math.round(r3)} %`});
  if(VIDEOS.length>=MIN_N&&v.ret3<=r3-6)neg.unshift({t:`Schwacher Einstieg: nur ${v.ret3} % nach 3 s`,d:`dein Median liegt bei ${Math.round(r3)} %`});
  const above=v.views>=allMed;
  /* Deine Einschätzung gegen die Daten prüfen */
  const beliefs=Object.entries(v.weights||{}).filter(([,w])=>w>1).map(([k,w])=>{
    const f=CAT.find(c=>c.wk===k),x=facs.find(y=>y.f===f);
    const label=`${WKEYS.find(q=>q.k===k).l} „${tagValue(v,k)}“`;
    if(!x||!x.ok)return {label,w,cls:'na',ic:'?',d:`Noch zu wenig Videos mit diesem Wert (${x?x.n:0}), um es zu prüfen.`};
    const agrees=above?x.r>1.1:x.r<.9;
    const how=x.r>=1?`läuft bei dir ${dec(x.r)}× so gut wie der Rest`:`läuft bei dir ${Math.round((1-x.r)*100)} % schlechter`;
    return agrees?{label,w,cls:'ok',ic:'✓',d:`Die Daten bestätigen das: ${how}.`}
                 :{label,w,cls:'no',ic:'!',d:`Die Daten sehen das bisher nicht: ${how}.`};
  });
  const ratio=allMed?v.views/allMed:1;
  const verdict=ratio>=1?`${dec(ratio)}× über deinem Median`:`${Math.round((1-ratio)*100)} % unter deinem Median`;
  return {pos,neg,verdict,allMed,beliefs};
}

function lineChart(vs){
  const W=640,H=220,pl=44,pr=14,pt=12,pb=26;
  let cum=0;const pts=vs.map(v=>(cum+=v.follower,{t:v.date.getTime(),y:cum}));
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const step=cum>0?Math.pow(10,Math.floor(Math.log10(cum)))/2:5;const ymax=Math.max(step,Math.ceil(cum/step)*step);
  const x=t=>pl+(t-t0)/(t1-t0||1)*(W-pl-pr),y=v=>pt+(1-v/ymax)*(H-pt-pb);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area=`${line}L${x(t1)},${y(0)}L${x(t0)},${y(0)}Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>ymax*f);
  const xt=t1>t0?[0,1/3,2/3,1].map(f=>new Date(t0+(t1-t0)*f)):[new Date(t0)];
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Follower-Wachstum, insgesamt ${fmt(cum)}">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`).join('')}
    ${xt.map((d,i)=>`<text x="${x(d.getTime())}" y="${H-6}" text-anchor="${i===0?'start':i===xt.length-1?'end':'middle'}">${dateStr(d)}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(last.t)}" cy="${y(last.y)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

      ${ins.length?insightList(ins):'<p class="empty-msg">Noch keine deutlichen Muster gefunden.</p>'}
      <p class="caveat">${S.useWeights?'Deine Gewichtung ist eingerechnet: „wichtig“ zählt doppelt, „Hauptgrund“ dreifach. ':''}Sicherheit: <b>stark</b> = großer Unterschied bei vielen Videos, <b>schwach</b> = könnte Zufall sein. Ein Zusammenhang ist nicht automatisch die Ursache. Je mehr Videos du einträgst, desto verlässlicher werden die Ergebnisse.</p>

function renderBars(){
  const f=catByKey(S.groupField),m=METRICS[S.groupMetric];
  const wf=v=>W(v,f);
  const rows=[...groups(f)].map(([name,vs])=>({name,n:vs.length,val:m.f(vs,wf),flop:vs.filter(v=>v.views<FLOP).length/vs.length*100,mk:marks(vs,f)}));
  rows.sort((a,b)=>(m.lowerBetter?a.val-b.val:b.val-a.val));
  const overall=m.f(VIDEOS,wf),max=Math.max(overall,...rows.map(r=>r.val))*1.05||1;
  $('#bars').innerHTML=`<div class="bars">${rows.map(r=>`<div class="bar-row">
      <div class="name" title="${esc(r.name)}">${esc(r.name)}<small>${r.n} Videos${r.n<MIN_N?' · zu wenig Daten':''}${r.mk&&S.useWeights?` · ${r.mk}× markiert`:''}${S.groupMetric!=='flop'?` · ${pct(r.flop)} Flops`:''}</small></div>
      <div class="track"><div class="fill ${r.n<MIN_N?'low':''}" style="width:${r.val/max*100}%"></div><div class="avg" style="left:${overall/max*100}%"></div></div>
      <div class="v">${m.fmt(r.val)}</div></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>${m.l}</span><span><i style="background:var(--ink);opacity:.55;width:2px"></i>Alle Videos: ${m.fmt(overall)}</span><span><i style="background:var(--muted);opacity:.45"></i>Unter ${MIN_N} Videos, noch nicht aussagekräftig</span></div>`;
}
function renderHeat(){
  const A=catByKey(S.heatA),B=catByKey(S.heatB),m=METRICS[S.heatMetric];
  const ga=[...groups(A)].sort((x,y)=>y[1].length-x[1].length),gbKeys=[...groups(B)].sort((x,y)=>y[1].length-x[1].length).map(x=>x[0]);
  const wf=v=>Math.max(W(v,A),W(v,B));
  const cells=[];
  for(const [an,avs] of ga)for(const bn of gbKeys){const vs=avs.filter(v=>B.g(v).includes(bn));if(vs.length)cells.push(m.f(vs,wf))}
  if(!cells.length){$('#heat').innerHTML='<p class="empty-msg">Noch keine Daten.</p>';return}
  const lo=Math.min(...cells),hi=Math.max(...cells);
  const tone=val=>{let t=hi>lo?(S.heatMetric==='views'||S.heatMetric==='follower'?(Math.log(val+1)-Math.log(lo+1))/(Math.log(hi+1)-Math.log(lo+1)):(val-lo)/(hi-lo)):.5;if(m.lowerBetter)t=1-t;return Math.round(8+t*72)};
  $('#heat').innerHTML=`<table class="heat"><thead><tr><th></th>${gbKeys.map(b=>`<th>${esc(b)}</th>`).join('')}</tr></thead><tbody>
    ${ga.map(([an,avs])=>`<tr><th>${esc(an)}</th>${gbKeys.map(bn=>{const vs=avs.filter(v=>B.g(v).includes(bn));if(!vs.length)return '<td class="empty">–</td>';const val=m.f(vs,wf),p=tone(val);
      return `<td style="background:color-mix(in srgb, var(--accent) ${p}%, var(--surface));${p>55?'color:var(--accent-ink)':''};${vs.length<2?'opacity:.55':''}" title="${esc(an)} × ${esc(bn)}: ${m.fmt(val)} (${vs.length} Videos)">${m.fmt(val)}<small>${vs.length} Vid.</small></td>`}).join('')}</tr>`).join('')}
  </tbody></table><p class="caveat">Je kräftiger die Farbe, desto besser. Blasse Felder beruhen auf nur einem Video.</p>`;
}
function renderScatter(){
  const nf=NUM.find(n=>n.k===S.scatterX);
  const xs=VIDEOS.map(nf.g),ys=VIDEOS.map(v=>v.views);
  const rho=spearman(xs,ys);
  const W=520,H=280,pl=46,pr=12,pt=10,pb=30;
  const xmin=Math.min(...xs),xmax=Math.max(...xs);
  const lmin=Math.floor(Math.log10(Math.max(1,Math.min(...ys))));let lmax=Math.ceil(Math.log10(Math.max(1,...ys)));if(lmax<=lmin)lmax=lmin+1;
  const x=v=>pl+(v-xmin)/(xmax-xmin||1)*(W-pl-pr),y=v=>pt+(1-(Math.log10(v)-lmin)/(lmax-lmin))*(H-pt-pb);
  const yt=[];for(let e=lmin;e<=lmax;e++)yt.push(10**e);
  const xt=[0,.25,.5,.75,1].map(f=>xmin+(xmax-xmin)*f);
  const col={flop:'var(--bad)',gut:'var(--accent)',viral:'var(--good)'};
  const strength=Math.abs(rho)>=.45?'deutlicher':Math.abs(rho)>=.25?'mittlerer':Math.abs(rho)>=.12?'schwacher':'kaum ein';
  $('#scatter').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(nf.l)} gegen Views">
    ${yt.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${short(t)}</text>`).join('')}
    ${xt.map((t,i)=>`<text x="${x(t)}" y="${H-8}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${dec(t,S.scatterX==='hour'?0:1)}</text>`).join('')}
    <line x1="${pl}" x2="${W-pr}" y1="${y(FLOP)}" y2="${y(FLOP)}" stroke="var(--bad)" stroke-dasharray="4 4" opacity=".7"/>
    <text x="${W-pr}" y="${y(FLOP)-5}" text-anchor="end" style="fill:var(--bad)">Flop-Grenze</text>
    ${VIDEOS.map(v=>`<circle cx="${x(nf.g(v)).toFixed(1)}" cy="${y(Math.max(1,v.views)).toFixed(1)}" r="4.5" fill="${col[status(v)]}" fill-opacity=".75" data-vid="${v.id}" style="cursor:pointer"><title>${esc(v.title)}: ${fmt(v.views)} Views</title></circle>`).join('')}
  </svg>
  <p style="margin-top:8px"><b>${strength[0].toUpperCase()+strength.slice(1)} Zusammenhang</b>${Math.abs(rho)>=.12?`: ${nf.phrase.toLowerCase().replace(/^je/,'je')}, desto ${rho>0?'mehr':'weniger'} Views.`:' mit deinen Views.'} <span class="mono" style="color:var(--muted)">ρ = ${dec(rho,2)}</span></p>
  <div class="legend"><span><i style="background:var(--bad)"></i>Flop</span><span><i style="background:var(--accent)"></i>Gut</span><span><i style="background:var(--good)"></i>Viral</span><span>Views-Achse logarithmisch</span></div>`;
}

/* ---------- Streamer ---------- */
function bestOf(vs,key){const m=new Map();for(const v of vs){if(!m.has(v[key]))m.set(v[key],[]);m.get(v[key]).push(v.views)}let b=null;for(const [k,a] of m)if(a.length>=2&&(!b||median(a)>b.m))b={k,m:median(a),n:a.length};return b}
function renderStreamer(){
  if(!VIDEOS.length){$('#view-streamer').innerHTML=emptyState('Streamer');return}
  const g=[...groups(catByKey('streamer'))].sort((a,b)=>median(b[1].map(v=>v.views))-median(a[1].map(v=>v.views)));
  const overall=median(VIDEOS.map(v=>v.views));
  $('#view-streamer').innerHTML=`
    <div class="view-head"><div><h1>Streamer</h1><p>Sortiert nach Median-Views. Collab-Videos zählen bei jedem beteiligten Streamer.</p></div></div>
    <div class="grid g-str">${g.map(([name,vs])=>{
      const med=median(vs.map(v=>v.views)),fl=vs.filter(v=>v.views<FLOP).length/vs.length*100,f=vs.reduce((s,v)=>s+v.follower,0);
      const bh=bestOf(vs,'hook'),be=bestOf(vs,'emotion'),bg=bestOf(vs,'spiel');
      const sorted=[...vs].sort((a,b)=>a.date-b.date),lmax=Math.log10(Math.max(...VIDEOS.map(v=>v.views)));
      return `<div class="card str" data-streamer="${esc(name)}" tabindex="0">
        <div class="str-top"><span class="avatar">${esc(name[0])}</span><div><h3>${esc(name)}</h3><small>${vs.length} Videos · ${med>=overall?'über':'unter'} deinem Schnitt</small></div></div>
        <div class="str-stats"><div><b>${short(med)}</b><span>Median-Views</span></div><div><b>${pct(fl)}</b><span>Flops</span></div><div><b>${fmt(f)}</b><span>Follower</span></div></div>
        <div class="spark" aria-label="Views pro Video">${sorted.map(v=>`<i style="height:${Math.max(6,(Math.log10(v.views)-2.5)/(lmax-2.5)*100)}%;background:${status(v)==='flop'?'var(--bad)':status(v)==='viral'?'var(--good)':'var(--accent)'}" title="${dateStr(v.date)}: ${fmt(v.views)}"></i>`).join('')}</div>
        <dl><dt>Bester Hook</dt><dd>${bh?`${esc(bh.k)} <span class="mono" style="color:var(--muted)">${short(bh.m)}</span>`:'noch zu wenig Daten'}</dd>
        <dt>Beste Emotion</dt><dd>${be?`${esc(be.k)} <span class="mono" style="color:var(--muted)">${short(be.m)}</span>`:'noch zu wenig Daten'}</dd>
        <dt>Bestes Spiel</dt><dd>${bg?`${esc(bg.k)} <span class="mono" style="color:var(--muted)">${short(bg.m)}</span>`:'noch zu wenig Daten'}</dd></dl>
      </div>`}).join('')}</div>`;
}

/* ---------- Drawer: Detail ---------- */
let lastFocus=null;
function openDrawer(title,sub,html){
  lastFocus=document.activeElement;
  $('#drawerTitle').textContent=title;$('#drawerSub').innerHTML=sub;$('#drawerBody').innerHTML=html;
  $('#drawer').hidden=false;$('#scrim').hidden=false;$('#drawerBody').scrollTop=0;$('#drawerClose').focus();
}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;if(lastFocus)lastFocus.focus()}
function whyHtml(v){
  const ex=explain(v);
  const li=a=>a.map(x=>`<li><div>${x.t}<br><small>${x.d}</small></div></li>`).join('');
  return `<h3>Warum lief es so?</h3>
      <p class="verdict">${fmt(v.views)} Views: ${ex.verdict}</p>
      ${ex.beliefs.length?`<div><p style="font-weight:600;margin-bottom:8px">Deine Einschätzung</p><ul class="belief">${ex.beliefs.map(b=>`<li><span class="ic ${b.cls}">${b.ic}</span><div>${esc(b.label)} <span class="wbadge">${WLABEL[b.w]}</span><small>${b.d}</small></div></li>`).join('')}</ul></div>`:''}
      ${ex.pos.length?`<div><p style="font-weight:600;margin-bottom:6px">Hat laut Daten geholfen</p><ul class="fac pos">${li(ex.pos)}</ul></div>`:''}
      ${ex.neg.length?`<div><p style="font-weight:600;margin-bottom:6px">Hat laut Daten eher gebremst</p><ul class="fac neg">${li(ex.neg)}</ul></div>`:''}
      ${!ex.pos.length&&!ex.neg.length?`<p>${VIDEOS.length<10?'Noch zu wenig Videos, um Muster zu erkennen.':'Keine Eigenschaft dieses Videos weicht deutlich von deinem Schnitt ab.'}</p>`:''}
      <p class="caveat" style="margin:0">Basierend auf dem Vergleich mit deinen anderen ${VIDEOS.length-1} Videos.</p>`;
}
let openId=null;
function openVideo(id){
  const v=VIDEOS.find(x=>x.id===+id);if(!v)return;
  openId=v.id;
  const m=[['Views',fmt(v.views)],['Neue Follower',fmt(v.follower)],['Likes',fmt(v.likes)],['Kommentare',fmt(v.comments)],['Shares',fmt(v.shares)],['Gespeichert',fmt(v.saves)],
    ['Ø Wiedergabe',dec(v.avgWatch)+' s'],['Wiedergabezeit',fmt(v.totalWatch)+' h'],['Komplett angesehen',v.completion+' %'],['Nach 3 s noch da',v.ret3+' %'],['Länge',v.laenge+' s'],['Pointe nach',v.pointe+' s']];
  const tags=[['Streamer',v.streamers.join(', ')],['Spiel',v.spiel],['Thema',v.thema],['Hook',v.hook],['Emotion',v.emotion],['Text-Overlay',v.overlay],['Untertitel',v.untertitel],['Audio',v.audio],['Sound',v.sound],['Kommentare',v.stimmung]];
  openDrawer(v.title,`${DAYS[v.date.getDay()]}, ${dateStr(v.date)} ${v.date.getFullYear()} · ${timeStr(v.date)} Uhr · ${pill(v)}${v.link&&/^https:\/\//.test(v.link)?` · <a href="${esc(v.link)}" target="_blank" rel="noopener">Auf TikTok ansehen</a>`:''}`,`
    <div class="why" id="whyBox">${whyHtml(v)}</div>
    <div><h3 style="margin-bottom:4px">Woran lag's deiner Meinung nach?</h3><p class="hint" style="margin-bottom:8px">Markier, was du für wichtig hältst. Die Analyse rechnet das mit ein, und oben siehst du, ob die Daten dir recht geben.</p>
      <div id="dwBox" data-wvid="${v.id}">${weightRows('dw_',v.weights||{},v)}</div></div>
    <div><h3 style="margin-bottom:10px">Zahlen nach 24 h</h3><div class="mgrid">${m.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('')}</div></div>
    <div><h3 style="margin-bottom:10px">Tags</h3><div class="tags">${tags.map(([a,b])=>`<span class="chip"><b>${a}</b>${esc(b)}</span>`).join('')}</div></div>
    <div class="ctl-row" id="vActions"><button class="btn" data-edit="${v.id}">Bearbeiten</button><button class="btn danger" data-del="${v.id}">Video löschen</button></div>`);
}

/* ---------- Drawer: Formular ---------- */
const uniq=k=>[...new Set(VIDEOS.flatMap(v=>Array.isArray(v[k])?v[k]:[v[k]]))].sort();
const DEF_EMO=['lustig','Rage','Schock','wholesome','Drama','Skill'],DEF_MOOD=['positiv','gemischt','negativ'];
const withDefaults=(defs,key)=>[...new Set([...defs,...uniq(key)])];
const radiosNew=(name,opts,sel,ph)=>`${radios(name,opts,sel)}<input type="text" id="${name}new" name="${name}new" placeholder="${ph}" style="margin-top:4px">`;
const radios=(name,opts,sel)=>`<div class="opts" role="radiogroup">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}" ${o===sel?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
const numF=(id,l,ph,suf='',val)=>`<div class="f"><label for="${id}">${l}${suf?` (${suf})`:''}</label><input type="number" id="${id}" name="${id}" min="0" step="any" placeholder="${ph}" inputmode="decimal" value="${val??''}"></div>`;
const listF=(id,l,key,ph,val)=>`<div class="f"><label for="${id}">${l}</label><input type="text" id="${id}" name="${id}" list="dl-${id}" placeholder="${ph}" value="${esc(val??'')}"><datalist id="dl-${id}">${uniq(key).map(o=>`<option value="${esc(o)}">`).join('')}</datalist></div>`;
const localInput=d=>{const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function openForm(edit){
  const e0=edit||{};
  const now=new Date();now.setDate(now.getDate()-1);now.setMinutes(0);
  const strs=[...new Set([...uniq('streamers'),...(e0.streamers||[])])];
  openDrawer(edit?'Video bearbeiten':'Video eintragen',edit?esc(edit.title):'24 h nach dem Upload die Werte aus TikTok Studio übernehmen',`
  <form id="vform" novalidate>
    <fieldset><legend>Video</legend><div class="fgrid">
      <div class="f full"><label for="ftitle">Titel / Notiz</label><input type="text" id="ftitle" name="ftitle" placeholder="z. B. Papaplatte verliert gegen Kind in Fortnite" value="${esc(e0.title||'')}"></div>
      <div class="f full"><label for="flink">Link zum Video (optional)</label><input type="url" id="flink" name="flink" placeholder="https://www.tiktok.com/@…/video/…" value="${esc(e0.link||'')}"></div>
      <div class="f"><label for="fdate">Uploadzeitpunkt</label><input type="datetime-local" id="fdate" name="fdate" value="${localInput(e0.date||now)}"></div>
      ${numF('flaenge','Videolänge','28','s',e0.laenge)}
    </div></fieldset>
    <fieldset><legend>Aus TikTok Studio (nach 24 h)</legend><div class="fgrid">
      ${numF('fviews','Views','12000','',e0.views)}${numF('ffollower','Neue Follower','45','',e0.follower)}
      ${numF('flikes','Likes','900','',e0.likes)}${numF('fcomments','Kommentare','40','',e0.comments)}
      ${numF('fshares','Shares','60','',e0.shares)}${numF('fsaves','Gespeichert','35','',e0.saves)}
      ${numF('favg','Ø Wiedergabedauer','14,5','s',e0.avgWatch)}${numF('ftotal','Gesamte Wiedergabezeit','48','h',e0.totalWatch)}
      ${numF('fcompl','Komplett angesehen','32','%',e0.completion)}${numF('fret3','Zuschauer nach 3 s','58','%',e0.ret3)}
    </div></fieldset>
    <fieldset><legend>Deine Tags</legend>
      <div class="f"><span class="flabel">Streamer (mehrere möglich)</span>${strs.length?`<div class="opts">${strs.map(s=>`<label><input type="checkbox" name="fstr" value="${esc(s)}" ${(e0.streamers||[]).includes(s)?'checked':''}><span>${esc(s)}</span></label>`).join('')}</div>`:''}
        <input type="text" id="fstrnew" name="fstrnew" placeholder="${strs.length?'Neuer Streamer? Mit Komma trennen':'Streamer eintippen, mehrere mit Komma trennen'}" style="margin-top:4px"></div>
      <div class="fgrid">${listF('fspiel','Spiel','spiel','Fortnite',e0.spiel)}${listF('fthema','Thema','thema','Fail',e0.thema)}${listF('fhook','Hook','hook','Schockmoment zuerst',e0.hook)}${listF('fsound','Sound','sound','Originalton',e0.sound)}
      ${numF('fpointe','Zeit bis zur Pointe','3','s',e0.pointe)}</div>
      <div class="f"><span class="flabel">Emotion</span>${radiosNew('femo',withDefaults(DEF_EMO,'emotion'),e0.emotion||'lustig','Neue Emotion? Hier eintippen')}</div>
      <div class="f"><span class="flabel">Text-Overlay</span>${radios('fov',[...new Set(['keins','Frage','Aussage','Spoiler',...uniq('overlay')])],e0.overlay||'keins')}</div>
      <div class="fgrid"><div class="f"><span class="flabel">Untertitel</span>${radios('fut',['ja','nein'],e0.untertitel||'ja')}</div>
      <div class="f"><span class="flabel">Audio</span>${radios('fau',['nur Original','mit Musik','Trend-Sound'],e0.audio||'nur Original')}</div></div>
      <div class="f"><span class="flabel">Kommentarstimmung</span>${radiosNew('fmood',withDefaults(DEF_MOOD,'stimmung'),e0.stimmung||'gemischt','Neue Stimmung? Hier eintippen')}</div>
    </fieldset>
    <fieldset><legend>Woran lag's? (optional)</legend>
      <p class="hint">Wenn du glaubst, dass eine Eigenschaft besonders wichtig für das Ergebnis war, markier sie. „Wichtig“ zählt in der Analyse doppelt, „Hauptgrund“ dreifach. Du kannst das später beim Video noch ändern.</p>
      ${weightRows('w_',e0.weights||{})}
    </fieldset>
    <p class="err" id="ferr" hidden></p>
    <div class="form-actions"><button type="button" class="btn" id="fcancel">Abbrechen</button><button type="submit" class="btn primary" id="fsubmit">${edit?'Änderungen speichern':'Speichern und auswerten'}</button></div>
  </form>`);
  $('#fcancel').onclick=()=>edit?openVideo(edit.id):closeDrawer();
  $('#vform').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target),raw=k=>String(fd.get(k)||'').trim(),n=k=>{const x=parseFloat(raw(k).replace(',','.'));return isFinite(x)?x:null};
    const streamers=[...new Set([...fd.getAll('fstr'),...raw('fstrnew').split(',').map(s=>s.trim()).filter(Boolean)])];
    const err=$('#ferr'),date=new Date(raw('fdate'));
    const problem=n('fviews')==null?'Bitte die Views eintragen.':!streamers.length?'Bitte mindestens einen Streamer auswählen oder eintippen.':isNaN(date)?'Bitte den Uploadzeitpunkt angeben.':'';
    if(problem){err.hidden=false;err.textContent=problem;return}
    const laenge=n('flaenge')??30;
    const v={...(edit||{}),title:raw('ftitle')||`${streamers.join(' & ')}: ${raw('fspiel')||'Clip'}`,link:raw('flink'),date,streamers,
      spiel:raw('fspiel')||'Unbekannt',thema:raw('fthema')||'Unbekannt',hook:raw('fhook')||'Unbekannt',sound:raw('fsound')||'Originalton',
      emotion:raw('femonew')||fd.get('femo'),overlay:fd.get('fov'),untertitel:fd.get('fut'),audio:fd.get('fau'),stimmung:raw('fmoodnew')||fd.get('fmood'),
      weights:Object.fromEntries(WKEYS.map(w=>[w.k,+fd.get('w_'+w.k)||1]).filter(([,x])=>x>1)),
      pointe:n('fpointe')??3,laenge,views:n('fviews'),follower:n('ffollower')??0,likes:n('flikes')??0,comments:n('fcomments')??0,shares:n('fshares')??0,saves:n('fsaves')??0,
      avgWatch:n('favg')??laenge*.5,totalWatch:n('ftotal')??0,completion:n('fcompl')??0,ret3:n('fret3')??0};
    const btn=$('#fsubmit');btn.disabled=true;btn.textContent='Speichert …';
    try{
      if(edit){Object.assign(edit,v);await updateVideo(edit)}else await createVideo(v);
      renderAll();openVideo(edit?edit.id:v.id);toast(DEMO?'Nur in der Vorschau geändert':edit?'Änderungen gespeichert':'Video gespeichert');
    }catch(ex){btn.disabled=false;btn.textContent='Nochmal versuchen';err.hidden=false;err.textContent='Speichern hat nicht geklappt: '+ex.message}
  };
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Routing & Events ---------- */
const TABS=['uebersicht','videos','analyse','streamer'];
function show(tab){
  if(!TABS.includes(tab))tab='uebersicht';S.tab=tab;
  for(const t of TABS)$('#view-'+t).hidden=t!==tab;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  try{localStorage.setItem('clipradar-tab',tab)}catch(e){}
  window.scrollTo(0,0);
}
function renderAll(){
  renderOverview();renderVideos();renderAnalyse();renderStreamer();
  $('#dataNote').textContent=DEMO?'Beispieldaten, nichts davon ist gespeichert':`${VIDEOS.length} Video${VIDEOS.length===1?'':'s'} gespeichert`;
  $('#demoBanner').hidden=!DEMO;
  document.querySelectorAll('[data-clear]').forEach(b=>b.disabled=!VIDEOS.length);
}
function openClear(){
  openDrawer('Alle Daten löschen?','Danach startest du mit einer leeren Liste',`
    <p>Alle <b>${VIDEOS.length} Videos</b> mit ihren Zahlen, Tags und Gewichtungen werden gelöscht. Das lässt sich nicht rückgängig machen.</p>
    <div class="ctl-row"><button class="btn" id="clearNo">Abbrechen</button><button class="btn danger solid" id="clearYes">Ja, alles löschen</button></div>`);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-new]')){if(DEMO)exitDemo().then(()=>openForm()).catch(fail);else openForm();return}
  if(t.closest('[data-sample]'))return startDemo();
  if(t.closest('[data-demo-off]')){exitDemo().then(()=>toast('Beispieldaten ausgeblendet')).catch(fail);return}
  if(t.closest('[data-clear]'))return openClear();
  if(t.id==='clearNo')return closeDrawer();
  if(t.id==='clearYes'){t.disabled=true;const wasDemo=DEMO;deleteAll().then(()=>{renderAll();closeDrawer();location.hash='uebersicht';toast(wasDemo?'Beispieldaten ausgeblendet':'Alle Daten gelöscht')}).catch(fail);return}
  const ed=t.closest('[data-edit]');if(ed)return openForm(VIDEOS.find(v=>v.id===+ed.dataset.edit));
  const del=t.closest('[data-del]');if(del){
    $('#vActions').innerHTML=`<span>Dieses Video wirklich löschen?</span><button class="btn" data-keep="${del.dataset.del}">Nein</button><button class="btn danger solid" data-delyes="${del.dataset.del}">Ja, löschen</button>`;return}
  const keep=t.closest('[data-keep]');if(keep)return openVideo(keep.dataset.keep);
  const dy=t.closest('[data-delyes]');if(dy){dy.disabled=true;deleteVideo(+dy.dataset.delyes).then(()=>{renderAll();closeDrawer();toast('Video gelöscht')}).catch(fail);return}
  const vid=t.closest('[data-vid]');if(vid)return openVideo(vid.dataset.vid);
  const ins=t.closest('.ins');
  if(ins){
    if(ins.dataset.field){S.groupField=ins.dataset.field;S.groupMetric=S.insMetric;location.hash='analyse';renderAnalyse();show('analyse');setTimeout(()=>$('#cmpCard').scrollIntoView({behavior:'smooth',block:'start'}),30)}
    else{S.scatterX=ins.dataset.num;location.hash='analyse';renderAnalyse();show('analyse');setTimeout(()=>$('#scCard').scrollIntoView({behavior:'smooth',block:'start'}),30)}
    return;
  }
  const insm=t.closest('[data-insm]');if(insm){S.insMetric=insm.dataset.insm;renderAnalyse();return}
  const th=t.closest('th[data-sort]');if(th){const k=th.dataset.sort;if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=k==='title'?1:-1}renderVideoTable();return}
  const str=t.closest('[data-streamer]');if(str){S.fStreamer=str.dataset.streamer;renderVideos();location.hash='videos';return}
  if(t.id==='scrim'||t.closest('#drawerClose'))closeDrawer();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#drawer').hidden)closeDrawer();
  if(e.key==='Enter'&&(e.target.classList.contains('ins')||e.target.dataset.streamer))e.target.click();
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='vq'){S.q=e.target.value;renderVideoTable()}
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='vstatus'){S.fStatus=v;renderVideoTable()}
  else if(id==='vstreamer'){S.fStreamer=v;renderVideoTable()}
  else if(id==='gField'){S.groupField=v;renderBars()}
  else if(id==='gMetric'){S.groupMetric=v;renderBars()}
  else if(id==='hA'){S.heatA=v;renderHeat()}
  else if(id==='hB'){S.heatB=v;renderHeat()}
  else if(id==='hM'){S.heatMetric=v;renderHeat()}
  else if(id==='sX'){S.scatterX=v;renderScatter()}
  else if(id==='useW'){S.useWeights=e.target.checked;renderAll()}
  else if(e.target.name&&e.target.name.startsWith('dw_')){
    const v=VIDEOS.find(x=>x.id===openId);if(!v)return;
    const k=e.target.name.slice(3);
    v.weights=v.weights||{};if(+e.target.value>1)v.weights[k]=+e.target.value;else delete v.weights[k];
    renderAll();$('#whyBox').innerHTML=whyHtml(v);updateVideo(v).then(()=>toast(DEMO?'Nur in der Vorschau geändert':'Einschätzung gespeichert')).catch(fail);
  }
  else if(id==='flopInput'){const n=parseInt(v,10);if(n>=0){FLOP=n;try{localStorage.setItem('clipradar-flop',n)}catch(e){}renderAll()}}
});

$('#flopInput').value=FLOP;
show(location.hash.slice(1)||S.tab);
$('#view-'+S.tab).innerHTML='<p class="loading">Lade deine Videos …</p>';
loadVideos().then(renderAll).catch(e=>{$('#view-'+S.tab).innerHTML=`<div class="card empty-state"><h2>Daten konnten nicht geladen werden</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`});
</script>
</body>
